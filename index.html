<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>斜面調査記録</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#E7F2F7">
<style>
  :root{
    --bg:#E7F2F7;
    --surface:#FFFFFF;
    --surface-2:#D7E9F1;
    --surface-3:#C2DCE8;
    --text:#223038;
    --text-dim:#5C7280;
    --accent:#2E6D9E;
    --accent-2:#5A8FB8;
    --danger:#B4463B;
    --border:#C4DAE6;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    height:100%;
    overscroll-behavior-y:none;
  }
  body{
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  #app{ min-height:100vh; padding-bottom:96px; }
  h1,h2,h3{ font-weight:700; margin:0; }
  .topbar{
    position:sticky; top:0; z-index:10;
    background:rgba(231,242,247,0.94);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
    padding:14px 16px;
    display:flex; align-items:center; gap:10px;
  }
  .topbar .back{
    background:none;border:none;color:var(--text-dim);font-size:22px;
    padding:4px 8px; margin-left:-8px; cursor:pointer;
  }
  .topbar .title{ font-size:15px; color:var(--text-dim); flex:1; }
  .stamp{
    display:inline-flex; align-items:baseline; gap:6px;
    font-family:var(--mono);
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:6px 10px;
  }
  .stamp .site{ font-size:13px; color:var(--text-dim); }
  .stamp .num{ font-size:20px; font-weight:700; color:var(--accent); letter-spacing:0.5px; }
  .content{ padding:16px; max-width:640px; margin:0 auto; }
  .section-title{
    font-size:13px; color:var(--text-dim); text-transform:uppercase;
    letter-spacing:0.08em; margin:22px 0 8px;
  }
  .section-title:first-child{ margin-top:0; }
  .card{
    background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:14px; margin-bottom:12px;
  }
  .card-tight{ padding:8px 12px; }
  .field{ margin-bottom:14px; }
  .field:last-child{ margin-bottom:0; }
  .field label{
    display:block; font-size:13px; color:var(--text-dim); margin-bottom:6px;
  }
  .field .hint{ font-size:12px; color:var(--text-dim); margin-top:4px; }
  .field-compact{ margin:4px 0; }
  .field-compact label{ display:block; font-size:11px; color:var(--text-dim); margin-bottom:2px; }
  .compact-input{ padding:6px 9px !important; font-size:14px !important; }
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--border);
    color:var(--text); border-radius:10px; padding:11px 12px; font-size:16px;
    font-family:var(--sans); appearance:none; -webkit-appearance:none;
  }
  select{ font-family:var(--mono); }
  textarea{ min-height:70px; resize:vertical; font-family:var(--sans); }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .row{ display:flex; gap:8px; }
  .row > *{ flex:1; min-width:0; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--surface-2); color:var(--text); border:1px solid var(--border);
    border-radius:12px; padding:13px 16px; font-size:15px; font-weight:600;
    cursor:pointer; width:100%; -webkit-tap-highlight-color:transparent;
  }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:#1B1D1B; }
  .btn-secondary{ background:var(--surface-2); }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--text-dim); }
  .btn-danger{ background:transparent; border-color:var(--danger); color:var(--danger); }
  .btn-block{ width:100%; margin-top:8px; }
  .btn-sm{ padding:8px 12px; font-size:13px; width:auto; }
  .btn-compact{ padding:8px 14px; font-size:14px; }
  .list-item{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:12px 14px; margin-bottom:8px; cursor:pointer;
  }
  .list-item:active{ background:var(--surface-2); }
  .list-item .num{ font-family:var(--mono); font-weight:700; color:var(--accent); font-size:17px; min-width:44px; }
  .list-item .meta{ flex:1; min-width:0; }
  .list-item .meta .badges{ display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
  .list-item .chev{ color:var(--text-dim); }
  .chip{
    font-size:11px; padding:3px 8px; border-radius:999px;
    background:var(--surface-3); color:var(--text-dim); border:1px solid var(--border);
  }
  .chip.on{ background:rgba(90,143,184,0.18); color:var(--accent); border-color:rgba(90,143,184,0.45); }
  .chip.warn{ background:rgba(180,70,59,0.15); color:#C0584B; border-color:rgba(180,70,59,0.35); }
  .thumb-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:10px; }
  .thumb{ aspect-ratio:1; border-radius:8px; overflow:hidden; border:1px solid var(--border); background:var(--surface-2); }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .empty{ text-align:center; color:var(--text-dim); padding:40px 20px; font-size:14px; }
  .lightbox-backdrop{
    position:fixed; inset:0; background:rgba(10,20,26,0.88); z-index:40;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
  }
  .lightbox-backdrop img{ max-width:92vw; max-height:78vh; border-radius:10px; }
  .lightbox-caption{ color:#EAF3F8; font-size:13px; margin-top:12px; font-family:var(--mono); }
  .lightbox-close{ margin-top:18px; }

  /* 撮影ボタン：普段はでかいブロックボタン、横向きでは右端固定の縦長シャッターに */
  .shutter-btn{
    flex-direction:column; gap:6px;
    padding:26px 16px; font-size:19px; font-weight:700;
    border-radius:18px;
  }
  .shutter-btn .shutter-emoji{ font-size:34px; line-height:1; }
  @media (orientation: landscape){
    .shutter-btn{
      position:fixed;
      top:50%; right:calc(14px + env(safe-area-inset-right));
      transform:translateY(-50%);
      width:144px; height:60vh; min-height:260px; max-height:420px;
      padding:24px 12px;
      z-index:25;
      box-shadow:0 6px 20px rgba(20,40,50,0.28);
    }
    .shutter-btn .shutter-emoji{ font-size:60px; }
    .shutter-btn .shutter-label{ writing-mode:vertical-rl; font-size:25px; letter-spacing:0.08em; }
  }
  .bottom-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, rgba(231,242,247,1) 60%, rgba(231,242,247,0));
  }
  .bottom-bar .inner{ max-width:640px; margin:0 auto; display:flex; gap:8px; }
  .block-card{ border-left:3px solid var(--accent); }
  .block-card .block-head{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;
  }
  .block-card .block-head .cat{
    font-weight:700; font-size:13px; display:inline-block;
    padding:3px 10px; border-radius:999px;
  }
  .block-card .block-head .sub{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .grade-box{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--surface-2); border:1px dashed var(--border);
    border-radius:10px; padding:10px 12px; margin-top:10px;
  }
  .grade-box .label{ font-size:12px; color:var(--text-dim); }
  .grade-box .value{ font-family:var(--mono); font-size:20px; font-weight:700; color:var(--accent); }
  .grade-box .value.none{ color:var(--text-dim); font-size:14px; font-weight:400; }
  .picker-row{ display:flex; align-items:center; gap:6px; }
  .picker-row .fixed{ font-family:var(--mono); font-size:16px; color:var(--text-dim); padding:0 2px; }
  .category-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .category-grid .btn{ font-size:14px; padding:16px 10px; }
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:30;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal{
    background:var(--surface); border:1px solid var(--border);
    border-radius:16px 16px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    width:100%; max-width:640px; max-height:85vh; overflow-y:auto;
  }
  .modal h3{ margin-bottom:12px; }
  .device-toggle{ display:flex; gap:8px; margin-bottom:4px; }
  .device-toggle .btn{ flex-direction:column; gap:4px; padding:16px; }
  .device-toggle .btn small{ color:var(--text-dim); font-weight:400; font-size:12px; }
  .device-toggle .btn.active{ background:var(--accent); border-color:var(--accent); color:#1B1D1B; }
  .device-toggle .btn.active small{ color:#1B1D1B; opacity:0.75; }
  .rec-indicator{
    display:flex; align-items:center; gap:8px; color:var(--danger); font-weight:600;
    font-size:14px; margin-bottom:8px;
  }
  .rec-dot{ width:10px; height:10px; border-radius:50%; background:var(--danger); animation:pulse 1s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  .memo-row{ display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-top:1px solid var(--border); font-size:13px; }
  .memo-row:first-child{ border-top:none; }
  .memo-row .fn{ font-family:var(--mono); font-size:12px; color:var(--text-dim); }
  .note-box{ font-size:13px; color:var(--text-dim); line-height:1.6; background:var(--surface-2); border-radius:10px; padding:12px; }
  .divider{ height:1px; background:var(--border); margin:16px 0; }
  a{ color:var(--accent); }
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
<script>
'use strict';

/* ============================== 定数・分類テーブル ============================== */

const CATEGORIES = ['地質','地形','堆積物','水・浸食','落石源','人工構造物','ほか'];

const HARDNESS_OPTIONS = [
  {code:'A', desc:'極硬（ハンマーで簡単に割れない／キンキン）'},
  {code:'B', desc:'硬（ハンマーで金属音／カンカン）'},
  {code:'C', desc:'中硬（ハンマーで容易に割れる／コンコン）'},
  {code:'D', desc:'軟（ハンマーでボロボロに砕ける／ボンボン）'},
  {code:'E', desc:'極軟（マサ状・粘土状／ボソボソ）'},
];
const SHAPE_OPTIONS = [
  {code:'I', desc:'棒状コア 50cm以上'},
  {code:'II', desc:'棒状コア 50〜15cm'},
  {code:'III', desc:'棒状〜片状コア 15〜5cm'},
  {code:'IV', desc:'片状コア 5cm以下（外周の一部残存）'},
  {code:'V', desc:'主に角礫状'},
  {code:'VI', desc:'主に砂状'},
  {code:'VII', desc:'主に粘土状'},
  {code:'VIII', desc:'コア採取不可（スライム含む）'},
];
const CRACK_OPTIONS = [
  {code:'a', desc:'密着 or 分離／割れ目沿いの風化・変質なし'},
  {code:'b', desc:'割れ目沿いに風化・変質あり／岩片はほぼ健全'},
  {code:'c', desc:'割れ目沿いの岩片が風化・変質し軟質化'},
  {code:'d', desc:'割れ目を認識できない（角礫状・砂状・粘土状）'},
];
// 岩級区分判定基準（硬軟区分 × 形状区分 × 割れ目状態区分 → 岩級）
// 参考資料のマトリクスを転記。未定義の組み合わせ（表内の「-」）は null。
// ※ 現場に出る前に一度、元の資料と突き合わせて確認してください。
const GRADE_TABLE = {
  A:{ I:{a:'B',b:'CH'}, II:{a:'CH',b:'CH'}, III:{b:'CH'} },
  B:{ I:{a:'CH',b:'CH'}, II:{a:'CH',b:'CH'}, III:{a:'CM',b:'CM',c:'CM'}, IV:{b:'CM',c:'CL'}, V:{b:'CL',c:'CL'} },
  C:{ II:{c:'CM'}, III:{b:'CM',c:'CL'}, IV:{b:'CL',c:'CL',d:'CL'}, V:{c:'CL',d:'D'} },
  D:{ IV:{c:'D'}, V:{c:'D',d:'D'}, VI:{d:'D'} },
  E:{ V:{d:'D'}, VI:{d:'D'} },
};
function calcGrade(h,s,c){
  if(!h||!s||!c) return null;
  const row = GRADE_TABLE[h]; if(!row) return null;
  const cell = row[s]; if(!cell) return null;
  return cell[c] || null;
}

const CATEGORY_COLORS = {
  '地質':'#9C6B3E',
  '地形':'#C1652A',
  '堆積物':'#B9932A',
  '水・浸食':'#1E8A8A',
  '落石源':'#8C3A4A',
  '人工構造物':'#5F6058',
  'ほか':'#7A5C8C',
};
function hexToRgba(hex, a){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

const CATEGORY_SCHEMA = {
  '地質':{
    fields:[
      {key:'rockType', label:'岩種', type:'select', allowOther:true,
        options:['砂岩','泥岩','混在岩','砂岩優勢互層','泥岩優勢互層','砂岩泥岩互層','シルト岩','礫岩','チャート','緑色岩','石灰岩','破砕帯','地すべり移動体']},
      {key:'lithofacies', label:'岩相', type:'select', options:['堅岩','弱風化岩','風化岩','亀裂質','緩み岩','破砕質','鏡肌'], allowOther:true},
      {key:'structureType', label:'構造', type:'select', options:['層理面','節理面','断層面','劈開面','すべり面'], allowOther:true},
      {key:'strikeDip', label:'走向傾斜', type:'strikedip'},
      {key:'hardness', label:'軟硬', type:'select', options:HARDNESS_OPTIONS.map(o=>o.code), optionMeta:HARDNESS_OPTIONS, grade:true},
      {key:'coreShape', label:'間隔', type:'select', options:SHAPE_OPTIONS.map(o=>o.code), optionMeta:SHAPE_OPTIONS, grade:true},
      {key:'crackState', label:'風化', type:'select', options:CRACK_OPTIONS.map(o=>o.code), optionMeta:CRACK_OPTIONS, grade:true},
      {key:'note', label:'備考', type:'textarea'},
    ]
  },
  '地形':{
    subtypeField:{key:'landformType', label:'種類', options:['崩壊跡','地すべり','クリープ','遷急線','遷緩線','段差','渓岸浸食','自由']},
    subtypeFields:{
      '崩壊跡':[ {key:'age', label:'新・古', type:'select', options:['新','古']}, {key:'height', label:'高さ(m)', type:'number'}, {key:'width', label:'幅(m)', type:'number'}, {key:'note', label:'備考', type:'textarea'} ],
      '地すべり':[ {key:'part', label:'部位', type:'select', options:['頭部','側部','末端部','自由']}, {key:'clarity', label:'明瞭度', type:'select', options:['明瞭','不明瞭']}, {key:'note', label:'備考', type:'textarea'} ],
      'クリープ':[ {key:'part', label:'部位', type:'select', options:['頭部','側部','末端部','自由']}, {key:'clarity', label:'明瞭度', type:'select', options:['明瞭','不明瞭']}, {key:'note', label:'備考', type:'textarea'} ],
      '遷急線':[ {key:'clarity', label:'明瞭度', type:'select', options:['明瞭','不明瞭']}, {key:'note', label:'備考', type:'textarea'} ],
      '遷緩線':[ {key:'clarity', label:'明瞭度', type:'select', options:['明瞭','不明瞭']}, {key:'note', label:'備考', type:'textarea'} ],
      '段差':[ {key:'clarity', label:'明瞭度', type:'select', options:['明瞭','不明瞭']}, {key:'height', label:'高さ(m)', type:'number'}, {key:'note', label:'備考', type:'textarea'} ],
      '渓岸浸食':[ {key:'clarity', label:'明瞭度', type:'select', options:['明瞭','不明瞭']}, {key:'height', label:'高さ(m)', type:'number'}, {key:'note', label:'備考', type:'textarea'} ],
      '自由':[ {key:'note', label:'内容', type:'textarea'} ],
    }
  },
  '堆積物':{
    fields:[
      {key:'depositType', label:'種類', type:'select', options:['崖錐堆積物','段丘堆積物','渓床堆積物','土石流堆積物'], allowOther:true},
      {key:'thickness', label:'層厚(m)', type:'number'},
      {key:'gravelSize', label:'礫径(cm)', type:'number'},
      {key:'depositState', label:'堆積状況', type:'select', options:['締まる','ルーズ','浸食','堆積'], allowOther:true},
      {key:'gullyPresence', label:'ガリーの有無', type:'select', options:['有','無']},
      {key:'note', label:'備考', type:'textarea'},
      {key:'vegType', label:'植生：種類', type:'select', options:['スギ','ヒノキ','広葉樹'], allowOther:true},
      {key:'dbh', label:'植生：胸高直径(cm)', type:'stepselect', step:5, min:0, max:150, unit:'cm'},
    ]
  },
  '水・浸食':{
    fields:[
      {key:'waterType', label:'種類', type:'select', options:['湧水','表流水','伏流','河川']},
      {key:'flow', label:'流量(L/min)', type:'number'},
      {key:'gully', label:'ガリーの有無', type:'select', options:['有','無']},
      {key:'note', label:'備考', type:'textarea'},
    ]
  },
  '落石源':{
    fields:[
      {key:'rockKind', label:'種類', type:'select', options:['浮石','転石']},
      {key:'grouping', label:'単体／群', type:'select', options:['単体','群']},
      {key:'sizeH', label:'高さ(m)', type:'stepselect', step:0.1, min:0, max:15, unit:'m', showIf:f=>f.grouping==='単体'},
      {key:'sizeW', label:'幅(m)', type:'stepselect', step:0.1, min:0, max:15, unit:'m', showIf:f=>f.grouping==='単体'},
      {key:'sizeD', label:'奥行き(m)', type:'stepselect', step:0.1, min:0, max:15, unit:'m', showIf:f=>f.grouping==='単体'},
      {key:'maxSizeH', label:'高さ(m)', type:'stepselect', step:0.1, min:0, max:15, unit:'m', showIf:f=>f.grouping==='群'},
      {key:'maxSizeW', label:'幅(m)', type:'stepselect', step:0.1, min:0, max:15, unit:'m', showIf:f=>f.grouping==='群'},
      {key:'maxSizeD', label:'奥行き(m)', type:'stepselect', step:0.1, min:0, max:15, unit:'m', showIf:f=>f.grouping==='群'},
      {key:'distH', label:'高さ(m)', type:'stepselect', step:0.1, min:0, max:15, unit:'m', showIf:f=>f.grouping==='群'},
      {key:'distW', label:'幅(m)', type:'stepselect', step:0.1, min:0, max:15, unit:'m', showIf:f=>f.grouping==='群'},
      {key:'distD', label:'奥行き(m)', type:'stepselect', step:0.1, min:0, max:15, unit:'m', showIf:f=>f.grouping==='群'},
      {key:'stability', label:'安定度', type:'select', options:['AA','A','B','C'], optionMeta:[
        {code:'AA', desc:'非常に不安定'},{code:'A', desc:'不安定'},{code:'B', desc:'やや不安定'},{code:'C', desc:'やや安定'}
      ]},
      {key:'note', label:'自由記載', type:'textarea'},
    ]
  },
  '人工構造物':{
    fields:[
      {key:'type', label:'種類', type:'select', options:['落石防護網','落石防護柵','切土のり面','盛土','砂防施設'], allowOther:true},
      {key:'sizeH', label:'サイズ：高さ(m)', type:'number'},
      {key:'sizeW', label:'サイズ：幅(m)', type:'number'},
      {key:'note', label:'自由記載', type:'textarea'},
    ]
  },
  'ほか':{
    fields:[ {key:'note', label:'内容', type:'textarea'} ]
  }
};

/* ============================== ユーティリティ ============================== */

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function pad2(n){ return String(n).padStart(2,'0'); }
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}`;
}
function todayISODate(){
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function nowISO(){ return new Date().toISOString(); }
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* ============================== 保存データ ============================== */

const STORAGE_KEY = 'slopeSurveyData_v1';

function defaultData(){
  return { deviceMode:null, currentSite:null, ui:{ screen:'siteSelect', currentPointId:null, recording:false, lastSaved:null }, sites:{} };
}
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      return Object.assign(defaultData(), parsed, { ui: Object.assign(defaultData().ui, parsed.ui||{}) });
    }
  }catch(e){ console.warn('load failed', e); }
  return defaultData();
}
let data = loadData();
function dropOldestThumbnail(){
  let oldest = null;
  for(const siteName in data.sites){
    for(const p of data.sites[siteName].points){
      for(const ph of (p.photos||[])){
        if(ph.thumb && (!oldest || ph.at < oldest.at)) oldest = ph;
      }
    }
  }
  if(oldest){ oldest.thumb = null; return true; }
  return false;
}
function save(){
  data.ui.lastSaved = Date.now();
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    return true;
  }catch(e){
    // 容量不足の可能性: 一番古いサムネイルから間引いて再試行（記録データそのものは守る）
    if(dropOldestThumbnail()) return save();
    alert('保存に失敗しました。端末の空き容量を確認してください。');
    return false;
  }
}
function lastSavedLabel(){
  if(!data.ui.lastSaved) return '';

  return `保存済み ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;

function getSite(){ return data.currentSite ? data.sites[data.currentSite] : null; }
function getCurrentPoint(){
  const site = getSite();

}
function nextPointNumber(site){

/* ============================== ファイル共有／保存 ============================== */

function saveFile(file){
  // 常に「保存(ダウンロード)」一発で確定させる。共有シートを介さないので、
  // タップし忘れで保存されない、という事態が起きない。
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 15000);
  return true;
}

/* ============================== 写真 ============================== */

function makeThumbnail(file, maxDim){
  return new Promise((resolve) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const scale = Math.min(1, maxDim / Math.max(w, h));
      w = Math.round(w * scale); h = Math.round(h * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      try{ resolve(canvas.toDataURL('image/jpeg', 0.6)); }
      catch(e){ resolve(null); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

document.getElementById('cameraInput').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  e.target.value = '';
  const point = getCurrentPoint();
  if(!point || files.length === 0) return;
  for(const file of files){
    point.photos = point.photos || [];
    const branch = point.photos.length + 1;
    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const filename = `${data.currentSite}${point.number}-${pad2(branch)}.${ext}`;
    const renamed = new File([file], filename, { type: file.type || 'image/jpeg' });
    const thumb = await makeThumbnail(file, 320);
    point.photos.push({ filename, at: nowISO(), thumb });
    save();
    render();
    saveFile(renamed);
  }
  render();
});

/* ============================== ボイスメモ ============================== */

let mediaRecorder = null, recordedChunks = [], recStream = null, recStart = null;

async function startRecording(){
  try{
    recStream = await navigator.mediaDevices.getUserMedia({ audio:true });
  }catch(e){
    alert('マイクを使用できませんでした。設定でマイクの許可を確認してください。');
    return;
  }
  const cand = ['audio/mp4','audio/aac','audio/webm'];
  const mimeType = cand.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
  try{
    mediaRecorder = mimeType ? new MediaRecorder(recStream, {mimeType}) : new MediaRecorder(recStream);
  }catch(e){
    mediaRecorder = new MediaRecorder(recStream);
  }
  recordedChunks = [];
  mediaRecorder.ondataavailable = (ev) => { if(ev.data && ev.data.size > 0) recordedChunks.push(ev.data); };
  mediaRecorder.onstop = onRecordingStop;
  mediaRecorder.start();
  recStart = Date.now();
  data.ui.recording = true;
  render();
}
function stopRecording(){
  if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
}
async function onRecordingStop(){
  const point = getCurrentPoint();
  const mt = mediaRecorder.mimeType || '';
  const blob = new Blob(recordedChunks, { type: mt || 'audio/webm' });
  const ext = mt.includes('mp4') ? 'm4a' : (mt.includes('aac') ? 'aac' : 'webm');
  if(recStream) recStream.getTracks().forEach(t => t.stop());
  data.ui.recording = false;
  if(point){
    point.voiceMemos = point.voiceMemos || [];
    const idx = point.voiceMemos.length + 1;
    const filename = `${data.currentSite}${point.number}_memo-${pad2(idx)}.${ext}`;
    const file = new File([blob], filename, { type: blob.type });
    const durationSec = Math.max(1, Math.round((Date.now() - recStart)/1000));
    point.voiceMemos.push({ filename, at: nowISO(), durationSec });
    save();
    render();
    saveFile(file);
  }
  render();
}

function renderInputOnly(scope, field, fieldsObj){
  const currentValue = fieldsObj[field.key];
  const bindAttr = `data-field="${field.key}"`;
  const id = `f_${scope}_${field.key}`;
  let inner = '';
  if(field.type === 'select'){
    const opts = field.options.map(opt => {
      const meta = field.optionMeta && field.optionMeta.find(m => m.code === opt);
      const text = meta ? `${opt}：${meta.desc}` : opt;
      const sel = currentValue === opt ? 'selected' : '';
      return `<option value="${escapeHtml(opt)}" ${sel}>${escapeHtml(text)}</option>`;
    }).join('');
    const otherOpt = field.allowOther ? `<option value="__other__" ${currentValue==='__other__'?'selected':''}>その他（自由記載）</option>` : '';
    inner = `<select id="${id}" ${bindAttr} data-scope="${scope}">
      <option value="">選択してください</option>
      ${opts}${otherOpt}
    </select>`;
    if(field.allowOther && currentValue === '__other__'){
      const otherValue = fieldsObj[field.key + '__other'];
      inner += `<input type="text" style="margin-top:8px" placeholder="自由記載"
        data-field="${field.key}__other" data-scope="${scope}" value="${escapeHtml(otherValue)}">`;
    }
  } else if(field.type === 'stepselect'){
    inner = `<select id="${id}" ${bindAttr} data-scope="${scope}">${stepOptions(currentValue, field.min, field.max, field.step, field.unit)}</select>`;
  } else if(field.type === 'number'){
    inner = `<input type="number" inputmode="decimal" step="0.1" id="${id}" ${bindAttr} data-scope="${scope}" value="${escapeHtml(currentValue||'')}">`;
  } else if(field.type === 'textarea'){
    inner = `<textarea id="${id}" ${bindAttr} data-scope="${scope}">${escapeHtml(currentValue||'')}</textarea>`;
  } else {
    inner = `<input type="text" id="${id}" ${bindAttr} data-scope="${scope}" value="${escapeHtml(currentValue||'')}">`;
  }
  return inner;
}
function renderField(scope, field, fieldsObj){
  const id = `f_${scope}_${field.key}`;
  return `<div class="field"><label for="${id}">${escapeHtml(field.label)}</label>${renderInputOnly(scope, field, fieldsObj)}</div>`;
}
function renderCompactRow(scope, rowLabel, fields, fieldsObj){
  const cells = fields.map(f => `<div style="flex:1;min-width:0">
      <div style="font-size:10px;color:var(--text-dim);margin-bottom:2px">${escapeHtml(f.label)}</div>
      ${renderInputOnly(scope, f, fieldsObj)}
    </div>`).join('');
  return `<div class="field"><label>${escapeHtml(rowLabel)}</label><div class="row" style="gap:6px">${cells}</div></div>`;
}

function degreeOptions(current){
  let html = '<option value="">--</option>';
  for(let i=0;i<=90;i++){
    const v = pad2(i);
    html += `<option value="${v}" ${current===v?'selected':''}>${v}°</option>`;
  }
  return html;
}
function stepOptions(current, min, max, step, unit){
  const decimals = step < 1 ? String(step).split('.')[1].length : 0;
  let html = '<option value="">--</option>';
  const count = Math.round((max - min) / step);
  for(let i=0;i<=count;i++){
    const v = (min + i*step).toFixed(decimals);
    html += `<option value="${v}" ${current===v?'selected':''}>${v}${unit||''}</option>`;
  }
  return html;
}
function renderStrikeDip(block){
  const sd = Object.assign({d1:'',ew:'E',d2:'',ns:'N'}, block.fields.strikeDip||{});
  const display = (sd.d1 && sd.d2) ? `N${sd.d1}${sd.ew}${sd.d2}${sd.ns}` : '（未入力）';
  return `<div class="field">
    <label>走向傾斜</label>
    <div class="picker-row">
      <span class="fixed">N</span>
      <select data-sdpart="d1" data-blockid="${block.id}">${degreeOptions(sd.d1)}</select>
      <select data-sdpart="ew" data-blockid="${block.id}">
        <option value="E" ${sd.ew==='E'?'selected':''}>E</option>
        <option value="W" ${sd.ew==='W'?'selected':''}>W</option>
      </select>
      <select data-sdpart="d2" data-blockid="${block.id}">${degreeOptions(sd.d2)}</select>
      <select data-sdpart="ns" data-blockid="${block.id}">
        <option value="N" ${sd.ns==='N'?'selected':''}>N</option>
        <option value="S" ${sd.ns==='S'?'selected':''}>S</option>
      </select>
    </div>
    <div class="hint">${escapeHtml(display)}</div>
  </div>`;
}

function renderGeologyExtra(block, schema){
  const f = block.fields;
  const gradeFields = schema.fields.filter(x => x.grade);
  let html = renderCompactRow(block.id, '岩級区分（軟硬／間隔／風化）', gradeFields, f);
  const grade = calcGrade(f.hardness, f.coreShape, f.crackState);
  html += `<div class="grade-box">
    <span class="label">岩級（自動判定）</span>
    <span class="value ${grade?'':'none'}">${grade ? escapeHtml(grade) : '3項目を選ぶと表示されます'}</span>
  </div>`;
  html += renderField(block.id, schema.fields.find(x=>x.key==='note'), f);
  return html;
}

function renderRockfallExtra(block, schema){
  const f = block.fields;
  const byKey = k => schema.fields.find(x => x.key === k);
  let html = renderCompactRow(block.id, '種類／単体・群', [byKey('rockKind'), byKey('grouping')], f);
  if(f.grouping === '単体'){
    html += renderCompactRow(block.id, 'サイズ', [byKey('sizeH'), byKey('sizeW'), byKey('sizeD')], f);
  } else if(f.grouping === '群'){
    html += renderCompactRow(block.id, '最大サイズ', [byKey('maxSizeH'), byKey('maxSizeW'), byKey('maxSizeD')], f);
    html += renderCompactRow(block.id, '分布範囲', [byKey('distH'), byKey('distW'), byKey('distD')], f);
  }
  html += renderField(block.id, byKey('stability'), f);
  html += renderField(block.id, byKey('note'), f);
  return html;
}

function renderBlock(block){
  const schema = CATEGORY_SCHEMA[block.category];
  let fieldsHtml = '';

  if(block.category === '地形'){
    const st = schema.subtypeField;
    const opts = st.options.map(o => `<option value="${escapeHtml(o)}" ${block.subtype===o?'selected':''}>${escapeHtml(o)}</option>`).join('');
    fieldsHtml += `<div class="field"><label>${escapeHtml(st.label)}</label>
      <select data-subtype-select data-blockid="${block.id}"><option value="">選択してください</option>${opts}</select></div>`;
    if(block.subtype && schema.subtypeFields[block.subtype]){
      for(const f of schema.subtypeFields[block.subtype]){
        fieldsHtml += renderField(block.id, f, block.fields);
      }
    }
  } else if(block.category === '地質'){
    for(const f of schema.fields){
      if(f.grade || f.key === 'note') continue;
      if(f.type === 'strikedip'){ fieldsHtml += renderStrikeDip(block); continue; }
      fieldsHtml += renderField(block.id, f, block.fields);
    }
    fieldsHtml += renderGeologyExtra(block, schema);
  } else if(block.category === '落石源'){
    fieldsHtml += renderRockfallExtra(block, schema);
  } else {
    for(const f of schema.fields){
      if(f.showIf && !f.showIf(block.fields)) continue;
      fieldsHtml += renderField(block.id, f, block.fields);
    }
  }

  const color = CATEGORY_COLORS[block.category] || null;
  const cardStyle = color ? `style="border-left-color:${color};border-left-width:5px;background:${hexToRgba(color,0.07)}"` : '';
  const catBadgeStyle = color ? `style="background:${color};color:#FFFFFF"` : '';
  return `<div class="card block-card" data-blockid="${block.id}" ${cardStyle}>
    <div class="block-head">
      <div>
        <div class="cat" ${catBadgeStyle}>${escapeHtml(block.category)}</div>
        ${block.subtype ? `<div class="sub">${escapeHtml(block.subtype)}</div>` : ''}
      </div>
      <button class="btn btn-ghost btn-sm" data-action="removeBlock" data-blockid="${block.id}">削除</button>
    </div>
    ${fieldsHtml}
  </div>`;
}

}

function renderPointDetail(){
  const point = getCurrentPoint();
  if(!point) return renderPointList();
  const showPhoto = data.deviceMode !== 'data';

  const photoThumbs = point.photos.filter(p=>p.thumb).map((p,i) => `
    <div class="thumb" data-action="viewPhoto" data-index="${point.photos.indexOf(p)}">
      <img src="${p.thumb}" alt="${escapeHtml(p.filename)}">
    </div>`).join('');
  const photoSection = showPhoto ? `
    <div class="section-title">写真</div>
    <div class="card">
      <div style="font-size:13px;color:var(--text-dim);margin-bottom:10px">
        撮影済み：${point.photos.length}枚
      </div>
      ${photoThumbs ? `<div class="thumb-grid">${photoThumbs}</div>` : ''}
      <button class="btn btn-primary btn-block shutter-btn" data-action="camera"><span class="shutter-emoji">📷</span><span class="shutter-label">撮影する</span></button>
      <div class="hint" style="margin-top:8px">撮影すると自動でファイルとして保存されます（画面上部にダウンロード完了の印が出ます）。サムネイルはタップで拡大できます。</div>
    </div>` : '';

  const recSection = `
    <div class="section-title">ボイスメモ</div>
    <div class="card card-tight">
      ${data.ui.recording ? `<div class="rec-indicator"><span class="rec-dot"></span>録音中…</div>` : ''}
      <button class="btn ${data.ui.recording?'btn-danger':'btn-secondary'} btn-block btn-compact" data-action="${data.ui.recording?'stopRec':'startRec'}">
        ${data.ui.recording ? '■ 録音を止めて保存' : '🎙 録音開始'}
      </button>
      ${point.voiceMemos.length ? point.voiceMemos.map(m => `
        <div class="memo-row"><span class="fn">${escapeHtml(m.filename)}</span><span>${m.durationSec}秒</span></div>
      `).join('') : ''}
    </div>`;

  const blocksSection = `
    <div class="section-title">調査対象</div>
    ${point.blocks.map(renderBlock).join('')}
    <button class="btn btn-secondary btn-block" data-action="openAddBlock">＋ 調査対象を追加</button>
  `;

  return `
    <div class="topbar">
      <button class="back" data-action="goPointList">‹</button>
      <div class="stamp"><span class="site">${escapeHtml(data.currentSite)}</span><span class="num">${escapeHtml(point.number)}</span></div>
      <div style="flex:1"></div>
    </div>
    <div style="padding:4px 16px 0;font-size:11px;color:var(--text-dim);text-align:right">${lastSavedLabel()}</div>
    <div class="content">
      <div class="card card-tight">
        <div class="row">
          <div class="field-compact"><label>箇所番号</label><input class="compact-input" type="text" data-pointfield="number" value="${escapeHtml(point.number)}"></div>
          <div class="field-compact"><label>日付</label><input class="compact-input" type="date" data-pointfield="date" value="${escapeHtml(point.date)}"></div>
        </div>
      </div>
      ${photoSection}
      ${recSection}
      ${blocksSection}
      <div class="divider"></div>
      <button class="btn btn-danger btn-block" data-action="deletePoint">この箇所を削除</button>
    </div>
  `;
}

function renderAddBlockModal(){
  return `<div class="modal-backdrop">
    <div class="modal">
      <h3>調査対象を選択</h3>
      <div class="category-grid">
        ${CATEGORIES.map(c => {
          const color = CATEGORY_COLORS[c];
          const style = color ? `style="border-left:5px solid ${color};background:${hexToRgba(color,0.10)}"` : '';
          return `<button class="btn btn-secondary" ${style} data-action="addBlock" data-category="${escapeHtml(c)}">${escapeHtml(c)}</button>`;
        }).join('')}
      </div>
      <button class="btn btn-ghost btn-block" style="margin-top:14px" data-action="closeModal">キャンセル</button>
    </div>
  </div>`;
}

function renderExport(){
  const site = getSite();
  const totalPhotos = site ? site.points.reduce((s,p)=>s+p.photos.length,0) : 0;
  const totalMemos = site ? site.points.reduce((s,p)=>s+p.voiceMemos.length,0) : 0;
  return `
    <div class="topbar">
      <button class="back" data-action="goPointList">‹</button>
      <div class="title">書き出し</div>
    </div>
    <div class="content">
      <div class="card">
        <div style="font-weight:600;margin-bottom:6px">${escapeHtml(data.currentSite||'')}</div>
        <div style="font-size:13px;color:var(--text-dim)">
          箇所数：${site?site.points.length:0}／写真：${totalPhotos}枚／ボイスメモ：${totalMemos}件
        </div>
      </div>
      <button class="btn btn-primary btn-block" data-action="exportJson">データを書き出す（共有／保存）</button>
      <div class="note-box" style="margin-top:10px">
        ここで書き出されるのは入力データ（JSON）です。写真とボイスメモは撮影・録音のたびに、この端末のFilesアプリ（ダウンロード）へ個別に保存済みです。<br><br>
        1日の終わりに、Filesアプリを開いて、この現場の写真・音声・JSONファイルをまとめてUSBメモリ（またはもう一方の端末にAirDrop）へコピーしてください。
      </div>
      <div class="divider"></div>
      <button class="btn btn-danger btn-block" data-action="deleteSite">この現場のデータを削除</button>
    </div>
  `;
}

/* ============================== メインレンダー ============================== */

function render(){
  let html;
  switch(data.ui.screen){
    case 'pointList': html = renderPointList(); break;
    case 'pointDetail': html = renderPointDetail(); break;
    case 'export': html = renderExport(); break;
    default: html = renderSiteSelect();
  }
  document.getElementById('app').innerHTML = html + (modalContent || '');
}

/* ============================== イベント委譲 ============================== */

document.getElementById('app').addEventListener('click', (e) => {
  if(e.target.classList && (e.target.classList.contains('modal-backdrop') || e.target.classList.contains('lightbox-backdrop'))){ closeModal(); return; }
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  switch(action){
    case 'setMode': setDeviceMode(el.dataset.mode); break;
    case 'selectSite': selectSite(el.dataset.name); break;
    case 'createSite': createSite(); break;
    case 'goSiteSelect': goSiteSelect(); break;
    case 'goPointList': goPointList(); break;
    case 'openPoint': openPoint(el.dataset.id); break;
    case 'addPoint': addPoint(); break;
    case 'goExport': goExport(); break;
    case 'exportJson': exportJson(); break;
    case 'deleteSite': deleteSite(); break;
    case 'camera': triggerCamera(); break;
    case 'startRec': startRecording(); break;
    case 'stopRec': stopRecording(); break;
    case 'openAddBlock': openModal(renderAddBlockModal()); break;
    case 'closeModal': closeModal(); break;
    case 'viewPhoto': openPhotoLightbox(Number(el.dataset.index)); break;
    case 'addBlock': addBlock(el.dataset.category); break;
    case 'removeBlock': removeBlock(el.dataset.blockid); break;
    case 'deletePoint': deletePoint(); break;
  }
});

document.getElementById('app').addEventListener('change', (e) => {
  const t = e.target;
  if(t.dataset.pointfield){
    updatePointField(t.dataset.pointfield, t.value);
    if(t.dataset.pointfield === 'number') render();
    return;
  }
  if(t.dataset.subtypeSelect !== undefined){
    updateBlockSubtype(t.dataset.blockid, t.value);
    return;
  }
  if(t.dataset.sdpart){
    updateStrikeDip(t.dataset.blockid, t.dataset.sdpart, t.value);
    return;
  }
  if(t.dataset.field && t.dataset.scope){
    updateBlockField(t.dataset.scope, t.dataset.field, t.value);
    if(t.tagName === 'SELECT') render();
    return;
  }
});
document.getElementById('app').addEventListener('input', (e) => {
  const t = e.target;
  if(t.tagName === 'SELECT') return; // change イベントで処理済み
  if(t.dataset.pointfield){ updatePointField(t.dataset.pointfield, t.value); return; }
  if(t.dataset.field && t.dataset.scope){ updateBlockField(t.dataset.scope, t.dataset.field, t.value); return; }
});

/* ============================== 初期化 ============================== */

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}

render();
</script>
</body>
</html>
